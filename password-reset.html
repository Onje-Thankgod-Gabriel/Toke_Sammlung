<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password | Toke's Sammlung</title>
    <meta name="description" content="Reset your Toke's Sammlung password. Enter your email address and we'll help you get back in." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body data-page="auth">

    <main>
        <!-- ===== PASSWORD RESET FORM ===== -->
        <section class="auth-form-section" aria-label="Reset your password">
            <div class="container">
                <div class="auth-form-card">
                    <!-- Theme toggle inside card -->
                    <button class="auth-card-theme-toggle" aria-label="Toggle dark mode" id="authThemeToggle" role="switch" aria-checked="false">
                        <span class="theme-icon" aria-hidden="true">☀</span>
                    </button>

                    <!-- Logo -->
                    <a href="index.html" class="auth-logo auth-logo-centered" aria-label="Toke's Sammlung home">
                        <img src="assets/images/TokeSammlungLogoSymbol.png" alt="Toke's Sammlung" class="anim-reveal-image" width="48" height="48" />
                        <span class="auth-logo-text auth-logo-text-2">Toke's <span class="gold">Sammlung</span></span>
                    </a>

                    <!-- Form Header -->
                    <div class="auth-form-header">
                        <h1 class="auth-form-title">Reset Your Password</h1>
                        <p class="auth-form-subtitle">
                            Enter the email address associated with your account and we'll help you reset your password.
                        </p>
                    </div>

                    <!-- Reset Form -->
                    <form class="auth-form" id="passwordResetForm" novalidate>
                        <div class="auth-form-group">
                            <label for="resetEmail">Email Address</label>
                            <input type="email" id="resetEmail" name="email" placeholder="Enter your email address" autocomplete="email" required />
                        </div>

                        <button type="submit" class="btn btn-primary auth-submit">Send Reset Link</button>

                        <p class="auth-switch">
                            <a href="login.html">← Back to Login</a>
                        </p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast" role="alert" aria-live="polite">
        <span class="toast-icon" aria-hidden="true"></span>
        <span class="toast-message" id="toastMessage">Message</span>
    </div>

     <!-- ===== SCROLL TO TOP BUTTON ===== -->
    <button class="scroll-to-top" aria-label="Scroll to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
        </svg>
    </button>

    <script src="assets/js/main.js"></script>
</body>
</html>
