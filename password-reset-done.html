<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Your Email | Toke's Sammlung</title>
    <meta name="description" content="Password reset instructions have been sent to your email. Check your inbox to continue." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body data-page="auth">


    <main>
        <!-- ===== PASSWORD RESET DONE – SUCCESS STATE ===== -->
        <section class="auth-form-section" aria-label="Password reset email sent">
            <div class="container">
                <div class="auth-form-card">
                    <!-- Theme toggle inside card -->
                    <button class="auth-card-theme-toggle" aria-label="Toggle dark mode" id="authThemeToggle" role="switch" aria-checked="false">
                        <span class="theme-icon" aria-hidden="true">☀</span>
                    </button>

                    <!-- Logo (centered with auth-logo-centered) -->
                    <a href="index.html" class="auth-logo auth-logo-centered" aria-label="Toke's Sammlung home">
                        <img src="assets/images/TokeSammlungLogoSymbol.png" alt="Toke's Sammlung" class="anim-reveal-image" width="48" height="48" />
                        <span class="auth-logo-text auth-logo-text-2">Toke's <span class="gold">Sammlung</span></span>
                    </a>

                    <!-- Success Content -->
                    <div class="auth-success-state">
                        <span class="auth-success-icon" aria-hidden="true">✉</span>
                        <h1 class="auth-success-title">Check Your Email</h1>
                        <p class="auth-success-text">
                            If an account exists with that email address, we've sent instructions to reset your password.
                        </p>
                        <p class="auth-success-note">
                            Please check your inbox and your spam or junk folder.
                        </p>
                        <div class="auth-success-actions">
                            <a href="login.html" class="btn btn-primary auth-success-btn">Back to Login</a>
                            <a href="index.html" class="btn btn-secondary auth-success-btn-secondary">Return to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast" role="alert" aria-live="polite">
        <span class="toast-icon" aria-hidden="true"></span>
        <span class="toast-message" id="toastMessage">Message</span>
    </div>

     <!-- ===== SCROLL TO TOP BUTTON ===== -->
    <button class="scroll-to-top" aria-label="Scroll to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
        </svg>
    </button>

    <script src="assets/js/main.js"></script>
</body>
</html>
